id = "herdr-ops.pr"
name = "Herdr PR"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show pull request metadata and open ghpr on demand."
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open pull request"
description = "Focus the existing ghpr pane or open it on the right."
contexts = ["workspace"]
command = ["bun", "bin/open-pr.ts", "open"]

[[panes]]
id = "ghpr"
title = "Pull request"
description = "GitHub pull request viewer."
placement = "split"
command = ["bun", "bin/open-pr.ts", "pane"]

[[panes]]
id = "error"
title = "Pull request unavailable"
description = "Show a pull request opening error."
placement = "popup"
width = "70%"
height = 10
command = ["bun", "bin/open-pr.ts", "error"]
