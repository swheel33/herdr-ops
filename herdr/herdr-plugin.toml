id = "herdr-ops.pr"
name = "Herdr PR"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Show pull request metadata and open ghpr on demand."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open pull request"
description = "Focus the existing ghpr pane or open it on the right."
contexts = ["workspace"]
command = ["bun", "bin/open-pr.ts", "open"]

[[panes]]
id = "ghpr"
title = "Pull request"
description = "GitHub pull request viewer."
placement = "split"
command = ["bun", "bin/open-pr.ts", "pane"]
